<svg baseProfile="full" height="541px" version="1.1" viewBox="0 0 1000 541" width="1000px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="541" width="1000" x="0" y="0" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start" x="42" y="48">A series pack is limited by its weakest group</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="42" y="76">Illustrative discharge profiles for a 3S lithium-ion pack under load.</text><line stroke="#dde6ee" stroke-linecap="round" stroke-width="2" x1="42" x2="958" y1="92" y2="92" /><rect fill="#f5f8fb" height="357" rx="12" ry="12" stroke="#dde6ee" stroke-width="1" width="908" x="45" y="119" /><line stroke="#1b2d44" stroke-linecap="round" stroke-width="2" x1="130" x2="852" y1="398" y2="398" /><line stroke="#1b2d44" stroke-linecap="round" stroke-width="2" x1="130" x2="130" y1="165" y2="398" /><line stroke="#dde6ee" stroke-dasharray="4 4" stroke-linecap="round" stroke-width="1" x1="130" x2="853" y1="170" y2="170" /><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" x="112" y="174">4.2</text><line stroke="#dde6ee" stroke-dasharray="4 4" stroke-linecap="round" stroke-width="1" x1="130" x2="853" y1="222" y2="222" /><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" x="112" y="226">3.8</text><line stroke="#dde6ee" stroke-dasharray="4 4" stroke-linecap="round" stroke-width="1" x1="130" x2="853" y1="274" y2="274" /><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" x="112" y="278">3.4</text><line stroke="#dde6ee" stroke-dasharray="4 4" stroke-linecap="round" stroke-width="1" x1="130" x2="853" y1="326" y2="326" /><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" x="112" y="330">3.0</text><line stroke="#dde6ee" stroke-dasharray="4 4" stroke-linecap="round" stroke-width="1" x1="130" x2="853" y1="378" y2="378" /><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="end" x="112" y="382">2.6</text><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" x="64" y="156">Cell V</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" x="550" y="429">Discharged capacity / time  →</text><polyline fill="none" points="135,181 210,222 325,235 430,247 540,269 635,290 730,309 780,331 815,377" stroke="#3274ae" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" points="135,178 210,217 325,231 430,242 540,264 635,284 730,304 780,322 820,374" stroke="#008c92" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" points="135,183 210,223 325,239 430,257 540,300 605,350 634,385" stroke="#bd5c52" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><line stroke="#bd5c52" stroke-dasharray="7 5" stroke-linecap="round" stroke-width="2" x1="634" x2="634" y1="167" y2="399" /><text fill="#bd5c52" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start" x="648" y="184">Weak group hits cutoff</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="648" y="204">while others retain energy</text><circle cx="634" cy="385" fill="#bd5c52" r="5" stroke="none" stroke-width="1" /><line stroke="#3274ae" stroke-linecap="round" stroke-width="4" x1="380" x2="404" y1="451" y2="451" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="412" y="456">Group A</text><line stroke="#008c92" stroke-linecap="round" stroke-width="4" x1="550" x2="574" y1="451" y2="451" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="582" y="456">Group B</text><line stroke="#bd5c52" stroke-linecap="round" stroke-width="4" x1="720" x2="744" y1="451" y2="451" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" x="752" y="456">Weak group C</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="43" y="513">Pack voltage alone can hide imbalance. A BMS should monitor individual series groups.</text></svg>