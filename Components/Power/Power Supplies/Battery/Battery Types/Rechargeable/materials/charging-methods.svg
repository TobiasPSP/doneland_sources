<svg baseProfile="full" height="502px" version="1.1" viewBox="0 0 1000 502" width="1000px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="502" width="1000" x="0" y="0" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start" x="42" y="48">Charging methods differ by chemistry</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="42" y="76">Curves are conceptual only. Always use limits from the exact cell or battery datasheet.</text><line stroke="#dde6ee" stroke-linecap="round" stroke-width="2" x1="42" x2="958" y1="92" y2="92" /><rect fill="#f5f8fb" height="318" rx="12" ry="12" stroke="#dde6ee" stroke-width="1" width="292" x="42" y="122" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="60" y="154">Li-ion / LFP</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="60" y="178">CC → CV → stop</text><line stroke="#dde6ee" stroke-linecap="round" stroke-width="2" x1="80" x2="303" y1="365" y2="365" /><line stroke="#dde6ee" stroke-linecap="round" stroke-width="2" x1="80" x2="80" y1="365" y2="207" /><polyline fill="none" points="87,337 107,315 137,279 172,248 207,233 292,233" stroke="#3274ae" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" points="87,234 197,234 216,254 236,282 267,316 292,343" stroke="#d58b29" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#3274ae" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" x="187" y="229">V</text><text fill="#d58b29" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="start" x="212" y="244">I</text><line stroke="#dde6ee" stroke-dasharray="5 4" stroke-linecap="round" stroke-width="1" x1="207" x2="207" y1="218" y2="366" /><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" x="207" y="385">CC             CV</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" x="62" y="413">Blue: voltage   Gold: current</text><rect fill="#f5f8fb" height="318" rx="12" ry="12" stroke="#dde6ee" stroke-width="1" width="292" x="353" y="122" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="371" y="154">NiMH / NiCd</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="371" y="178">Current + termination</text><line stroke="#dde6ee" stroke-linecap="round" stroke-width="2" x1="391" x2="614" y1="365" y2="365" /><line stroke="#dde6ee" stroke-linecap="round" stroke-width="2" x1="391" x2="391" y1="365" y2="207" /><polyline fill="none" points="398,346 433,305 473,268 518,242 549,232 571,235 588,244" stroke="#3274ae" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" points="398,277 583,277" stroke="#d58b29" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><line stroke="#bd5c52" stroke-dasharray="5 4" stroke-linecap="round" stroke-width="2" x1="587" x2="587" y1="222" y2="365" /><text fill="#bd5c52" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" x="583" y="217">STOP</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="503" y="385">Voltage peak / temperature</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" x="373" y="413">Blue: voltage   Gold: current</text><rect fill="#f5f8fb" height="318" rx="12" ry="12" stroke="#dde6ee" stroke-width="1" width="292" x="664" y="122" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="682" y="154">Lead–acid</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="682" y="178">Bulk → absorption → float</text><line stroke="#dde6ee" stroke-linecap="round" stroke-width="2" x1="702" x2="925" y1="365" y2="365" /><line stroke="#dde6ee" stroke-linecap="round" stroke-width="2" x1="702" x2="702" y1="365" y2="207" /><polyline fill="none" points="709,339 754,277 791,234 848,234 856,279 914,279" stroke="#3274ae" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" points="709,237 789,237 835,281 914,332" stroke="#d58b29" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" x="813" y="385">Bulk     Absorb.     Float</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="start" x="684" y="413">Blue: voltage   Gold: current</text><text fill="#bd5c52" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="42" y="477">A BMS can disconnect a faulty pack; it does not decide the correct charging voltage or current.</text></svg>