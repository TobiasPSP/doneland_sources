<svg baseProfile="full" height="540px" version="1.1" viewBox="0 0 1000 540" width="1000px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="540" width="1000" x="0" y="0" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start" x="42" y="48">Same physical size does not mean interchangeable</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="42" y="76">Pay attention to nominal voltage, full-charge voltage, and rechargeability.</text><line stroke="#dde6ee" stroke-linecap="round" stroke-width="2" x1="42" x2="958" y1="92" y2="92" /><rect fill="#f5f8fb" height="354" rx="13" ry="13" stroke="#dde6ee" stroke-width="1" width="430" x="42" y="120" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="69" y="155">20 × 3.2 mm COIN CELLS</text><circle cx="129" cy="203" fill="#e8edf0" r="36" stroke="#8399aa" stroke-width="4" /><circle cx="129" cy="203" fill="#f5f7f8" r="31" stroke="#c9d5df" stroke-width="1" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="129" y="208">CR</text><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" x="190" y="198">CR2032</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="190" y="221">3.0 V  |  primary</text><circle cx="129" cy="296" fill="#e8edf0" r="36" stroke="#8399aa" stroke-width="4" /><circle cx="129" cy="296" fill="#f5f7f8" r="31" stroke="#c9d5df" stroke-width="1" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="129" y="301">ML</text><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" x="190" y="291">ML2032</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="190" y="314">3.0 V  |  rechargeable</text><circle cx="129" cy="389" fill="#e8edf0" r="36" stroke="#8399aa" stroke-width="4" /><circle cx="129" cy="389" fill="#f5f7f8" r="31" stroke="#c9d5df" stroke-width="1" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="129" y="394">LI</text><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" x="190" y="384">LIR2032</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="190" y="407">3.6–3.7 V  |  rechargeable</text><rect fill="#f5f8fb" height="354" rx="13" ry="13" stroke="#dde6ee" stroke-width="1" width="464" x="494" y="120" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" x="520" y="155">AA SIZE AND CLOSE RELATIVES</text><rect fill="#d58b29" height="48" rx="13" ry="13" stroke="#27394d" stroke-width="1" width="112" x="529" y="173" /><rect fill="#8295a7" height="20" rx="2" ry="2" stroke="none" stroke-width="1" width="7" x="641" y="187" /><text fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" x="585" y="203">AA</text><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" x="676" y="193">Alkaline AA</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="676" y="216">1.5 V  |  primary</text><rect fill="#008c92" height="48" rx="13" ry="13" stroke="#27394d" stroke-width="1" width="112" x="529" y="266" /><rect fill="#8295a7" height="20" rx="2" ry="2" stroke="none" stroke-width="1" width="7" x="641" y="280" /><text fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" x="585" y="296">AA</text><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" x="676" y="286">NiMH AA</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="676" y="309">1.2 V  |  rechargeable</text><rect fill="#3274ae" height="48" rx="13" ry="13" stroke="#27394d" stroke-width="1" width="112" x="529" y="359" /><rect fill="#8295a7" height="20" rx="2" ry="2" stroke="none" stroke-width="1" width="7" x="641" y="373" /><text fill="white" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" x="585" y="389">AA</text><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" x="676" y="379">Li-ion 14500</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="676" y="402">3.6–3.7 V  |  rechargeable</text><text fill="#bd5c52" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="43" y="511">A 14500 lithium-ion cell and an LIR2032 can damage equipment designed for primary AA / CR2032.</text></svg>