" font-size="14" font-weight="normal" text-anchor="start" x="43" y="401">Sodium-ion (example)</text><rect fill="#eff3f6" height="27" rx="6" ry="6" stroke="none" stroke-width="1" width="548" x="315" y="383" /><rect fill="#7c73b4" height="27" rx="6" ry="6" stroke="none" stroke-width="1" width="424.7" x="315" y="383" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" x="880" y="402">3.1 V</text><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="43" y="445">LiFePO₄</text><rect fill="#eff3f6" height="27" rx="6" ry="6" stroke="none" stroke-width="1" width="548" x="315" y="427" /><rect fill="#5e966f" height="27" rx="6" ry="6" stroke="none" stroke-width="1" width="438.40000000000003" x="315" y="427" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" x="880" y="446">3.2 V</text><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="43" y="489">Li-ion NMC / NCA</text><rect fill="#eff3f6" height="27" rx="6" ry="6" stroke="none" stroke-width="1" width="548" x="315" y="471" /><rect fill="#3274ae" height="27" rx="6" ry="6" stroke="none" stroke-width="1" width="506.90000000000003" x="315" y="471" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" x="880" y="490">3.7 V</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="start" x="43" y="536">For sodium-ion, voltage depends strongly on the cathode and anode system.</text></svg>