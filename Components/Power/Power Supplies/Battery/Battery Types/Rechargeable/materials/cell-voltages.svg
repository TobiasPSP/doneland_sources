<svg baseProfile="full" height="579px" version="1.1" viewBox="0 0 1000 579" width="1000px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="579" width="1000" x="0" y="0" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start" x="42" y="48">Nominal voltage is a chemistry property</text><text fill="#5b6c7b" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="42" y="76">Approximate values for one cell. Fully charged voltage may be substantially higher.</text><line stroke="#dde6ee" stroke-linecap="round" stroke-width="2" x1="42" x2="958" y1="92" y2="92" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="43" y="137">NiCd / NiMH</text><rect fill="#eff3f6" height="27" rx="6" ry="6" stroke="none" stroke-width="1" width="548" x="315" y="119" /><rect fill="#008c92" height="27" rx="6" ry="6" stroke="none" stroke-width="1" width="164.4" x="315" y="119" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" x="880" y="138">1.2 V</text><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="43" y="181">Lithium primary AA (Li-FeS₂)</text><rect fill="#eff3f6" height="27" rx="6" ry="6" stroke="none" stroke-width="1" width="548" x="315" y="163" /><rect fill="#d58b29" height="27" rx="6" ry="6" stroke="none" stroke-width="1" width="205.5" x="315" y="163" /><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start" x="880" y="182">1.5 V</text><text fill="#1b2d44" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" x="43" y="225">NiZn</text><rect fil