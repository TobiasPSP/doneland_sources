<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img">
<style>text{font-family:DejaVu Sans,Arial,sans-serif}.title{font-size:31px;font-weight:700;fill:#e9f2fc}.sub{font-size:17px;fill:#afc0d2}.h{font-size:20px;font-weight:700;fill:#f0f6fc}.p{font-size:17px;fill:#d1deeb}.small{font-size:14px;fill:#a8bed2}.tag{font-size:15px;font-weight:700}</style>
<rect width="1000" height="560" fill="#0b1522"/><text x="45" y="58" class="title">From apparent recovery to delayed cell failure</text>
<text x="45" y="90" class="sub">Observed events, November 4–7, 2026 · schematic, not a continuous voltage recording</text>
<line x1="100" y1="172" x2="905" y2="172" stroke="#4e657d" stroke-width="5" stroke-linecap="round"/>
<circle cx="112" cy="172" r="12" fill="#61b6ff" stroke="#0b1522" stroke-width="5"/><text x="112" y="135" fill="#61b6ff" text-anchor="middle" class="tag">NOV 4</text><text x="112" y="225" text-anchor="middle" class="h">Overdischarge</text><text x="112" y="253" text-anchor="middle" class="small">0.57 V per cell</text><circle cx="345" cy="172" r="12" fill="#6bd5b6" stroke="#0b1522" stroke-width="5"/><text x="345" y="135" fill="#6bd5b6" text-anchor="middle" class="tag">RECOVERY</text><text x="345" y="225" text-anchor="middle" class="h">Charge accepted</text><text x="345" y="253" text-anchor="middle" class="small">3.757 V per cell</text><circle cx="595" cy="172" r="12" fill="#61b6ff" stroke="#0b1522" stroke-width="5"/><text x="595" y="135" fill="#61b6ff" text-anchor="middle" class="tag">FIRST ~48 H</text><text x="595" y="225" text-anchor="middle" class="h">Minor early drift</text><text x="595" y="253" text-anchor="middle" class="small">~1 vs ~2 mV/h</text><circle cx="862" cy="172" r="12" fill="#ea6e67" stroke="#0b1522" stroke-width="5"/><text x="862" y="135" fill="#ea6e67" text-anchor="middle" class="tag">NOV 7</text><text x="862" y="225" text-anchor="middle" class="h">Cell-specific failure</text><text x="862" y="253" text-anchor="middle" class="small">One cell: 1.65 V</text><rect x="45" y="313" width="910" height="204" rx="17" fill="#142536" stroke="#344c64"/>
<text x="70" y="352" class="h">What the cell measurements actually establish</text>
<line x1="72" y1="410" x2="920" y2="410" stroke="#52677f" stroke-width="1" stroke-dasharray="5 7"/>
<rect x="86" y="390" width="21" height="13" rx="3" fill="#6bd5b6"/><text x="118" y="402" class="p">Healthy cell: remained near its prior voltage</text>
<rect x="86" y="428" width="21" height="13" rx="3" fill="#ea6e67"/><text x="118" y="440" class="p">Damaged cell: measured at 1.65 V on November 7</text>
<text x="86" y="485" class="small">No readings during the last 24 h before discovery: exact onset and peak leakage current unknown.</text>
</svg>