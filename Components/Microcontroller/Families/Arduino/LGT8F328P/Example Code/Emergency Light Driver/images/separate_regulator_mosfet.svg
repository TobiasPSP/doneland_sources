<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Separate regulator and MOSFET architecture</title>
  <desc id="desc">A DC regulator feeds an LED string that is switched by a separate low-side MOSFET. The regulator experiences large load steps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfcfe"/><stop offset="1" stop-color="#eef3f8"/></linearGradient>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#38506a"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".13"/></filter>
  </defs>
  <rect width="1600" height="800" rx="32" fill="url(#bg)"/>
  <text x="800" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#15314f">Separate regulator + switching MOSFET</text>
  <text x="800" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#53657a">Fast transistor switching does not guarantee fast optical response</text>

  <g font-family="Arial, sans-serif">
    <rect x="80" y="280" width="210" height="150" rx="22" fill="#fff" stroke="#7f95aa" stroke-width="4"/>
    <text x="185" y="340" text-anchor="middle" font-size="30" font-weight="700" fill="#24384d">12–14.4 V</text>
    <text x="185" y="381" text-anchor="middle" font-size="25" fill="#53657a">DC supply</text>

    <rect x="400" y="245" width="300" height="220" rx="22" fill="#e8f3ff" stroke="#2474b9" stroke-width="5"/>
    <text x="550" y="320" text-anchor="middle" font-size="30" font-weight="700" fill="#174f7f">DC regulator</text>
    <text x="550" y="362" text-anchor="middle" font-size="24" fill="#315e82">preferably CC</text>
    <text x="550" y="403" text-anchor="middle" font-size="21" fill="#53657a">feedback loop • soft-start</text>

    <rect x="815" y="245" width="270" height="220" rx="22" fill="#edf9f4" stroke="#22966a" stroke-width="5"/>
    <text x="950" y="312" text-anchor="middle" font-size="29" font-weight="700" fill="#176747">LED string</text>
    <g stroke="#1674c5" fill="none" stroke-width="5">
      <path d="M855 370 h35 l-15 -20 m15 20 l-15 20 M900 345 v50"/>
      <path d="M925 370 h35 l-15 -20 m15 20 l-15 20 M970 345 v50"/>
      <path d="M995 370 h35 l-15 -20 m15 20 l-15 20 M1040 345 v50"/>
    </g>

    <rect x="1200" y="245" width="280" height="220" rx="22" fill="#fff4e7" stroke="#df7b15" stroke-width="5"/>
    <text x="1340" y="310" text-anchor="middle" font-size="29" font-weight="700" fill="#a5550b">N-MOSFET</text>
    <path d="M1318 338 v75 M1365 338 v75 M1318 376 h47 M1388 350 v54" stroke="#a5550b" stroke-width="6" fill="none"/>
    <text x="1340" y="442" text-anchor="middle" font-size="21" fill="#53657a">low-side switch</text>
  </g>

  <path d="M290 355 H390" stroke="#38506a" stroke-width="8" marker-end="url(#arr)"/>
  <path d="M700 355 H805" stroke="#38506a" stroke-width="8" marker-end="url(#arr)"/>
  <path d="M1085 355 H1190" stroke="#38506a" stroke-width="8" marker-end="url(#arr)"/>
  <path d="M1340 465 V550 H185 V440" fill="none" stroke="#38506a" stroke-width="7"/>

  <rect x="1190" y="585" width="300" height="120" rx="22" fill="#fff" stroke="#8d71b4" stroke-width="4"/>
  <text x="1340" y="632" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#65448e">MCU pattern output</text>
  <path d="M1245 671 h30 v-26 h45 v26 h45 v-26 h45 v26 h28" stroke="#8d71b4" stroke-width="6" fill="none"/>
  <path d="M1340 585 V475" stroke="#8d71b4" stroke-width="7" marker-end="url(#arr)"/>

  <path d="M535 210 v-62 h46 v38 h46 v-38 h46 v62" fill="none" stroke="#ef476f" stroke-width="6"/>
  <text x="604" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#be284c">0 A ↔ full load</text>
  <text x="604" y="498" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#be284c">The converter must recover from every load step.</text>
</svg>
